# Fork-only: build + push the server image to GHCR on every deploy-branch push,
# so a merge/sync auto-publishes ghcr.io/apple-techie/omnigent-server with no
# manual `docker push`. dokploy-root pulls it anonymously (the package is
# public). Not an upstream workflow — additive, so upstream merges never touch
# it. See .github/workflows/oss-publish-images.yml for the upstream analogue
# (different namespace, tag-triggered).
name: Publish deploy image

on:
  push:
    branches: [deploy/acp-slug-branding]
  workflow_dispatch: {}

# One publish per ref at a time; a newer push supersedes an in-flight build.
concurrency:
  group: deploy-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/apple-techie/omnigent-server"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          # Immutable per-commit pin plus a floating tag the deploy can track.
          echo "tags=${IMAGE}:sha-${SHORT_SHA},${IMAGE}:deploy-latest" >> "$GITHUB_OUTPUT"

      # amd64 only: the deploy host (dokploy-root) is amd64, and single-arch
      # keeps the build fast. Add linux/arm64 here if an arm host ever pulls it.
      - name: Build and push server image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
