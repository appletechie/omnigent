# Fork-only: build + push the server image to GHCR on every deploy-branch push,
# so a merge/sync auto-publishes ghcr.io/apple-techie/omnigent-server with no
# manual `docker push`. dokploy-root pulls it anonymously (the package is
# public). Not an upstream workflow — additive, so upstream merges never touch
# it.
#
# Auth: the GHCR_PAT repo secret, NOT the built-in GITHUB_TOKEN. This repo is a
# fork, and GitHub excludes forks from a package's Actions-access list (and the
# source-repo inherit path doesn't grant it either), so GITHUB_TOKEN can never
# push to this account-owned package. A user PAT authenticates as the account
# and pushes regardless — set once as a secret, automatic forever. Scope the PAT
# to packages write only.
name: Publish deploy image

on:
  push:
    branches: [deploy/acp-slug-branding]
    # Workflow/CI-only changes don't affect the image — skip the rebuild.
    paths-ignore:
      - ".github/**"
  workflow_dispatch: {}

# One publish per ref at a time; a newer push supersedes an in-flight build.
concurrency:
  group: deploy-image-${{ github.ref }}
  cancel-in-progress: true

# Only checkout access is needed from GITHUB_TOKEN; the GHCR push authenticates
# with the GHCR_PAT secret, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Compute tags
        id: tags
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${OWNER}/omnigent-server"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          # Immutable per-commit pin plus a floating tag the deploy can track.
          echo "tags=${IMAGE}:sha-${SHORT_SHA},${IMAGE}:deploy-latest" >> "$GITHUB_OUTPUT"

      # amd64 only: the deploy host (dokploy-root) is amd64, and single-arch
      # keeps the build fast. Add linux/arm64 here if an arm host ever pulls it.
      - name: Build and push server image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
